name: CI/CD Pipeline for CloudSim Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  simulate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Clean install
      run: mvn clean install -DskipTests
    
    - name: Prepare output directory
      run: mkdir -p output
    
    - name: Run simulation and capture complete output
      run: |
        # Run simulation and pipe ALL output to file
        mvn exec:java -pl modules/cloudsim-examples \
          -Dexec.mainClass=org.cloudbus.cloudsim.examples.CostEfficientResourceAllocation \
          -Djava.awt.headless=true > output/results.txt 2>&1
        
        # Move any generated charts to output directory
        mv *.png output/ 2>/dev/null || echo "No charts generated"
        
        # Add execution metadata
        echo -e "\n\n=== Simulation Metadata ===" >> output/results.txt
        echo "Timestamp: $(date)" >> output/results.txt
        echo "Java Version: $(java -version 2>&1 | head -1)" >> output/results.txt
    
    - name: Verify outputs
      run: |
        echo "Generated files:"
        ls -l output/
        echo -e "\nLast 20 lines of output:"
        tail -20 output/results.txt
    
    - name: Upload complete results
      uses: actions/upload-artifact@v4
      with:
        name: simulation-complete-results
        path: output/
        if-no-files-found: error