name: CI/CD Pipeline for CloudSim Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Create output directory for storing results and charts
      - name: Create output directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          echo "Output directory created"

      # Step 4: Build the project using Maven
      - name: Build and Install All Modules
        run: |
          mvn clean install -DskipTests
          echo "Build completed successfully"

      # Step 5: Install Xvfb for headless chart generation (required by JFreeChart)
      - name: Install Xvfb for headless chart generation
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libxrender2 libxtst6 libxi6
          echo "Xvfb installed successfully"

      # Step 6: Run the simulation and capture results
      - name: Run Simulation and Capture Results
        id: simulation
        run: |
          # Run simulation in headless mode to generate charts and save logs
          xvfb-run -a mvn exec:java -pl modules/cloudsim-examples \
            -Dexec.mainClass=org.cloudbus.cloudsim.examples.EnhancedPowerOptimization \
            -Djava.awt.headless=true \
            > $GITHUB_WORKSPACE/output/simulation_results.txt 2>&1

          # Move generated charts to output directory (if any)
          mv *.png $GITHUB_WORKSPACE/output/ || echo "No charts generated"

          # Extract final results from simulation logs
          FINAL_RESULTS=$(grep -A 100 "================ Final Results ================" $GITHUB_WORKSPACE/output/simulation_results.txt)
          
          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo "$FINAL_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF"

      # Step 7: Upload simulation results and charts as artifacts
      - name: Upload Results Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simulation-artifacts
          path: |
            $GITHUB_WORKSPACE/output/*
          if-no-files-found: warn

