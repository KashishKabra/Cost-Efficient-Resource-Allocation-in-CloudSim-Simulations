name: CI/CD Pipeline for CloudSim Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Create output directory for storing results and charts
      - name: Create output directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          echo "Output directory created at $GITHUB_WORKSPACE/output"
          
      # Step 4: Build the project using Maven
      - name: Build and Install All Modules
        run: |
          mvn clean install -DskipTests
          echo "Build completed successfully"
          
      # Step 5: Run the simulation and capture results
      - name: Run Simulation and Capture Results
        id: simulation
        run: |
          # Verify output directory exists
          echo "Pre-simulation directory contents:"
          ls -la $GITHUB_WORKSPACE
          
          # Run simulation in headless mode
          mvn exec:java -pl modules/cloudsim-examples \
            -Dexec.mainClass=org.cloudbus.cloudsim.examples.EnhancedPowerOptimization \
            -Djava.awt.headless=true \
            -Dexec.args="output" \
            > $GITHUB_WORKSPACE/output/simulation_results.txt 2>&1
          
          # Debug: Show generated files
          echo "Post-simulation directory contents:"
          ls -la $GITHUB_WORKSPACE/output
          
          # Process results with unique delimiter
          DELIMITER=$(openssl rand -hex 8)
          FINAL_RESULTS=$(grep -A 100 "================ Final Results ================" $GITHUB_WORKSPACE/output/simulation_results.txt)
          CLEAN_RESULTS=$(echo "$FINAL_RESULTS" | sed '/Downloading from/d' | sed '/Progress/d' | sed '/Downloaded/d')
          
          # Write output with dynamic delimiter
          {
            echo "results<<${DELIMITER}"
            printf "%s\n" "$CLEAN_RESULTS"
            echo "${DELIMITER}"
          } >> $GITHUB_OUTPUT
      
      # Step 6: Upload simulation results and charts as artifacts
      - name: Upload Simulation Results
        uses: actions/upload-artifact@v4
        with:
          name: simulation-artifacts
          path: $GITHUB_WORKSPACE/output
          if-no-files-found: error
          
      # Step 7: Display summary of simulation results
      - name: Show Simulation Summary
        if: success()
        run: |
          echo "### CloudSim Simulation Completed Successfully! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View the detailed results in the artifacts section." >> $GITHUB_STEP_SUMMARY
          
          # Count charts generated
          CHART_COUNT=$(ls -1 $GITHUB_WORKSPACE/output/*.png 2>/dev/null | wc -l)
          if [ $CHART_COUNT -gt 0 ]; then
            echo "* $CHART_COUNT chart(s) generated" >> $GITHUB_STEP_SUMMARY
            echo "* Charts:" >> $GITHUB_STEP_SUMMARY
            ls -1 $GITHUB_WORKSPACE/output/*.png | while read file; do
              echo "  - $(basename $file)" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "* No charts were generated" >> $GITHUB_STEP_SUMMARY
            echo "Debug: Output directory contents:" >> $GITHUB_STEP_SUMMARY
            ls -la $GITHUB_WORKSPACE/output >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add result file size
          if [ -f "$GITHUB_WORKSPACE/output/simulation_results.txt" ]; then
            RESULT_SIZE=$(du -h "$GITHUB_WORKSPACE/output/simulation_results.txt" | cut -f1)
            echo "* Simulation results size: $RESULT_SIZE" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add any warnings or errors
          if grep -q "ERROR" "$GITHUB_WORKSPACE/output/simulation_results.txt"; then
            echo "### ❌ Errors detected during simulation:" >> $GITHUB_STEP_SUMMARY
            grep "ERROR" "$GITHUB_WORKSPACE/output/simulation_results.txt" >> $GITHUB_STEP_SUMMARY
          fi

      # Step 8: Debug information
      - name: Debug Information
        if: always()
        run: |
          echo "### Debug Information"
          echo "Working directory: $(pwd)"
          echo "Output directory contents:"
          ls -la $GITHUB_WORKSPACE/output
          echo "Environment variables:"
          printenv | grep GITHUB
          echo "Simulation output (last 50 lines):"
          tail -n 50 $GITHUB_WORKSPACE/output/simulation_results.txt