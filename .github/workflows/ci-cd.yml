name: CI/CD Pipeline for CloudSim Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Create output directory for storing results and charts
      - name: Create output directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          echo "Output directory created at $GITHUB_WORKSPACE/output"
          
      # Step 4: Build the project using Maven
      - name: Build and Install All Modules
        run: |
          mvn clean install -DskipTests
          echo "Build completed successfully"
          
      # Step 5: Run the simulation and capture results
      - name: Run Simulation
        run: |
          # Create output folder right where the code runs
          mkdir -p simulation-output
          
          # Run simulation and save everything to the folder
          mvn exec:java -pl modules/cloudsim-examples \
            -Dexec.mainClass=org.cloudbus.cloudsim.examples.EnhancedPowerOptimization \
            -Djava.awt.headless=true > simulation-output/results.txt
          
          # Simple check to show what was created
          ls -l simulation-output
      
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: simulation-output